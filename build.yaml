# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#
---
include:
  - board: xiao_ble//zmk
    shield: unified_hub_adeptble
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: xiao_ble//zmk
    shield: adeptble
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: unified_hub_sofle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: xiao_ble//zmk
    shield: sofle_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: sofle_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: unified_hub_adeptble settings_reset
    artifact-name: unified_hub_adeptble_settings_reset
  - board: xiao_ble//zmk
    shield: adeptble settings_reset
    artifact-name: adeptble_settings_reset
  - board: xiao_ble//zmk
    shield: unified_hub_sofle settings_reset
    artifact-name: unified_hub_sofle_settings_reset
  - board: xiao_ble//zmk
    shield: sofle_left settings_reset
    artifact-name: sofle_left_settings_reset
  - board: xiao_ble//zmk
    shield: sofle_right settings_reset
    artifact-name: sofle_right_settings_reset
