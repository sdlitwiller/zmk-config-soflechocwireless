CONFIG_ZMK_KEYBOARD_NAME="Sofle+Adept Hub"

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# USB-only Studio access; disable BLE transport to prevent duplicate entries in ZMK Studio
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=n

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3
