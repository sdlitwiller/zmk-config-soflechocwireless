# Sofle Dongle — USB central that relays keyboard events from sofle_left and
# sofle_right split peripherals, and mouse events from the adeptble trackball
# peripheral, to the host over USB HID.

# Split central role (USB relay, no local key matrix)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Connect to three peripherals: sofle_left, sofle_right, adeptble trackball
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3

# Forward trackball pointer events from the peripheral via input split
CONFIG_ZMK_INPUT_SPLIT=y

# USB HID output to the host
CONFIG_ZMK_USB=y

# BLE for communicating with the split peripherals
CONFIG_ZMK_BLE=y

# Pointing / mouse support
CONFIG_ZMK_POINTING=y
